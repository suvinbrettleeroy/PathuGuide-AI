{# Shared by every body.pg-ui page. Expects `language`; set `ta` and `pg_page` in the page. #}
<script>
    // Mark JS as available and skip the intro curtain on repeat visits in this tab.
    (function () {
        var root = document.documentElement;
        root.classList.add('pg-js');
        try {
            if (sessionStorage.getItem('pgIntroSeen')) { root.classList.add('pg-seen'); }
            else { sessionStorage.setItem('pgIntroSeen', '1'); }
        } catch (e) {}
    })();
</script>
